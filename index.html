}

.lesson-body{

}

.lesson-card.open .lesson-body{

}

}

.lesson-body > p{

}

.lesson-columns{

.lesson-note{

}

.lesson-note.accent{

  border-color:#f3d5c6;
}

.lesson-note strong{
  display:block;
  margin-bottom:6px;
  color:#786d6f;
  font-size:10px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.lesson-note p,
.lesson-note ul{
  margin:0;
  color:#625759;
  font-size:11.5px;
  line-height:1.6;
}

.lesson-note ul{
  padding-left:17px;
}

.lesson-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  margin-top:15px;
}

.lesson-go{
  background:#282124;
  border-color:#282124;
  color:#fff;
}

.lesson-complete{
  display:flex;
  align-items:center;
  gap:8px;
  color:#6f6466;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}

.lesson-complete input{
  width:18px;
  height:18px;
  accent-color:var(--folder);
}

.learning-glossary{
  padding:22px;
  margin-bottom:16px;
}

.glossary-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
}

.glossary-item{
  padding:13px;
  border:1px solid #ece5e0;
  border-radius:12px;
  background:#fcfbf9;
}

.glossary-item strong{
  display:block;
  margin-bottom:4px;
  color:#332b2d;
  font-size:11.5px;
}

.glossary-item span{
  display:block;
  color:#8a7e80;
  font-size:10.5px;
  line-height:1.5;
}

.learning-tip{
  display:flex;
  align-items:flex-start;
  gap:12px;

  color:#fff;
}

.learning-tip-icon{
  width:32px;
  height:32px;
  flex:0 0 32px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:rgba(255,105,72,.16);
  color:#ff824d;
}

.learning-tip strong{
  display:block;
  margin-bottom:4px;
  font-size:12px;
}

.learning-tip span{
  display:block;
  color:#bdb4b6;
  font-size:11px;
  line-height:1.55;
}


/* ---------- ACCESO ESPECIAL EN CELULAR ---------- */
.mobile-learning-shortcut{
  display:none;
}

  .routine-grid{

</style>

<script>
(function(){

  /* Evita crear el Learning Center dos veces */
  if(document.getElementById("learning")) return;

  const content = document.getElementById("content");
  const rail = document.querySelector(".rail");

  if(!content || !rail){
    console.warn("MSMP Learning Center: no se encontró #content o .rail");
    return;
  }


  /* =========================================================
     1. AGREGAR BOTÓN AL MENÚ DE DESKTOP
  ========================================================= */

  const learningTab = document.createElement("button");

  learningTab.className = "tab";
  learningTab.dataset.view = "learning";

  learningTab.innerHTML = `
    <span class="num">06</span>
    <span>Aprende</span>
  `;

  const railFoot = rail.querySelector(".rail-foot");

  if(railFoot){
    rail.insertBefore(learningTab,railFoot);
  }else{
    rail.appendChild(learningTab);
  }


  /* =========================================================
     2. BOTÓN GRANDE PARA CELULAR
  ========================================================= */

  const shortcut = document.createElement("button");

  shortcut.type = "button";
  shortcut.className = "mobile-learning-shortcut";
  shortcut.id = "mobileLearningShortcut";

  shortcut.innerHTML = `
    <span class="mobile-learning-icon">🎓</span>

    <span class="mobile-learning-copy">
      <strong>Learning Center</strong>
      <span>Aprende a usar tu Command Center</span>
    </span>

    <span class="mobile-learning-arrow">→</span>
  `;

  const mobileBrand = document.querySelector(".mobile-brand");

  if(mobileBrand){
    mobileBrand.insertAdjacentElement("afterend",shortcut);
  }else{
    const main = document.querySelector("main");
    if(main) main.insertBefore(shortcut,main.firstChild);
  }


  /* =========================================================
     3. CONTENIDO DEL LEARNING CENTER
  ========================================================= */

  const section = document.createElement("section");

  section.className = "view";
  section.id = "learning";

  section.innerHTML = `

    <div class="view-head">
      <div>
        <h1>Learning Center</h1>
        <p>Aprende qué significa cada parte, para qué sirve y cómo aplicarla.</p>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="refresh-btn" id="learningOpenAllBtn">
          Abrir módulos
        </button>

        <button class="refresh-btn btn-solid" id="learningStartBtn">
          Empezar tutorial
        </button>
      </div>
    </div>


    <div class="learning-hero">

      <div class="learning-intro">

        <div class="learning-kicker">
          MSMP · MARKETING OPERATIONS
        </div>

        <h2>
          Aprende a manejar tu agencia desde un solo lugar.
        </h2>

        <p>
          Este centro está diseñado para ayudarte a entender no solamente
          dónde hacer clic, sino cómo utilizar la información del Command
          Center para organizar clientes, contenido, tareas, campañas y
          aprobaciones.
        </p>

        <div class="learning-actions">

          <button class="learning-primary" id="learningContinueBtn">
            Continuar donde quedé
          </button>

          <button class="learning-secondary" id="learningResetBtn">
            Reiniciar progreso
          </button>

        </div>

      </div>


      <div class="learning-progress-card">

        <div class="learning-progress-label">
          Tu progreso
          <strong id="learningProgressText">0 / 8</strong>
        </div>

        <div class="learning-progress-track">
          <div
            class="learning-progress-fill"
            id="learningProgressFill">
          </div>
        </div>

        <p class="learning-progress-note">
          Marca cada módulo cuando sientas que ya entiendes cómo usarlo.
          Tu progreso queda guardado en este dispositivo.
        </p>

        <div
          class="learning-complete-banner"
          id="learningCompleteBanner">
          ✓ Completaste todo el Learning Center.
        </div>

      </div>

    </div>


    <div class="learning-routine">

      <div class="learning-section-heading">

        <div>
          <h3>Tu rutina recomendada</h3>
          <p>No necesitas revisar todo todo el tiempo.</p>
        </div>

      </div>


      <div class="routine-grid">

        <div class="routine-step">
          <div class="routine-num">01</div>
          <strong>Mira el Dashboard</strong>
          <span>
            Empieza viendo qué necesita atención.
          </span>
        </div>

        <div class="routine-step">
          <div class="routine-num">02</div>
          <strong>Revisa tareas</strong>
          <span>
            Ataca primero lo atrasado y lo importante.
          </span>
        </div>

        <div class="routine-step">
          <div class="routine-num">03</div>
          <strong>Destraba contenido</strong>
          <span>
            Revisa qué piezas están detenidas en el pipeline.
          </span>
        </div>

        <div class="routine-step">
          <div class="routine-num">04</div>
          <strong>Chequea resultados</strong>
          <span>
            Mira campañas y aprobaciones antes de terminar.
          </span>
        </div>

      </div>

    </div>


    <div class="learning-grid">


      <!-- 01 -->
      <article class="lesson-card" data-lesson="start">

        <div class="lesson-top">

          <div class="lesson-index">01</div>

          <div class="lesson-title">
            <h4>Empieza aquí</h4>
            <p>Cómo funciona todo el sistema</p>
          </div>

          <button class="lesson-toggle">Abrir</button>

        </div>

        <div class="lesson-body">

          <p>
            El Agency Command Center funciona como una capa visual sobre la
            información de tu agencia. En vez de entrar directamente al
            Google Sheet para interpretar filas y columnas, aquí puedes ver
            la operación organizada por función.
          </p>

          <div class="lesson-columns">

            <div class="lesson-note">
              <strong>La idea</strong>
              <p>
                El Sheet guarda la información. El Command Center la convierte
                en una herramienta mucho más fácil de usar.
              </p>
            </div>

            <div class="lesson-note accent">
              <strong>Cómo pensar</strong>
              <p>
                Dashboard te dice qué pasa. Las demás secciones te permiten
                actuar sobre eso.
              </p>
            </div>

          </div>

          <div class="lesson-footer">

            <button
              class="lesson-go"
              data-go-view="dashboard">
              Ir al Dashboard
            </button>

            <label class="lesson-complete">
              <input
                type="checkbox"
                data-complete="start">
              Entendido
            </label>

          </div>

        </div>

      </article>


      <!-- 02 -->
      <article class="lesson-card" data-lesson="dashboard">

        <div class="lesson-top">

          <div class="lesson-index">02</div>

          <div class="lesson-title">
            <h4>Dashboard</h4>
            <p>Tu centro de control diario</p>
          </div>

          <button class="lesson-toggle">Abrir</button>

        </div>

        <div class="lesson-body">

          <p>
            El Dashboard debe responder una pregunta:
            <strong>¿qué necesita mi atención hoy?</strong>
          </p>

          <div class="lesson-columns">

            <div class="lesson-note">
              <strong>Qué mirar</strong>
              <ul>
                <li>Clientes activos</li>
                <li>Tareas atrasadas</li>
                <li>Contenido en parrilla</li>
                <li>Aprobaciones pendientes</li>
                <li>Campañas saludables</li>
              </ul>
            </div>

            <div class="lesson-note accent">
              <strong>Cómo aplicarlo</strong>
              <p>
                No empieces el día creando trabajo nuevo. Primero identifica
                qué está atrasado, bloqueado o esperando una decisión.
              </p>
            </div>

          </div>

          <div class="lesson-footer">

            <button
              class="lesson-go"
              data-go-view="dashboard">
              Ver Dashboard
            </button>

            <label class="lesson-complete">
              <input
                type="checkbox"
                data-complete="dashboard">
              Entendido
            </label>

          </div>

        </div>

      </article>


      <!-- 03 -->
      <article class="lesson-card" data-lesson="clientes">

        <div class="lesson-top">

          <div class="lesson-index">03</div>

          <div class="lesson-title">
            <h4>Clientes</h4>
            <p>La base de tu agencia</p>
          </div>

          <button class="lesson-toggle">Abrir</button>

        </div>

        <div class="lesson-body">

          <p>
            Aquí vive la información principal de cada cliente.
            Piensa en esta sección como tu lista maestra de cuentas.
          </p>

          <div class="lesson-columns">

            <div class="lesson-note">
              <strong>Qué significa</strong>
              <ul>
                <li><b>Monthly Fee:</b> mensualidad del cliente.</li>
                <li><b>Ad Budget:</b> dinero destinado a publicidad.</li>
                <li><b>Services:</b> servicios contratados.</li>
                <li><b>Status:</b> Active, Paused o Inactive.</li>
                <li><b>Drive:</b> acceso a la carpeta del cliente.</li>
              </ul>
            </div>

            <div class="lesson-note accent">
              <strong>Cómo aplicarlo</strong>
              <p>
                Mantén esta información actualizada porque otras partes del
                sistema dependen de los nombres y datos de los clientes.
              </p>
            </div>

          </div>

          <div class="lesson-footer">

            <button
              class="lesson-go"
              data-go-view="clientes">
              Ir a Clientes
            </button>

            <label class="lesson-complete">
              <input
                type="checkbox"
                data-complete="clientes">
              Entendido
            </label>

          </div>

        </div>

      </article>


      <!-- 04 -->
      <article class="lesson-card" data-lesson="contenido">

        <div class="lesson-top">

          <div class="lesson-index">04</div>

          <div class="lesson-title">
            <h4>Parrilla de contenido</h4>
            <p>Del concepto a la publicación</p>
          </div>

  /* =========================================================
     4. NAVEGACIÓN
  ========================================================= */

  function openView(view){

    document
      .querySelectorAll(".tab")
      .forEach(tab => tab.classList.remove("active"));

    document
      .querySelectorAll(".view")
      .forEach(viewEl => viewEl.classList.remove("active"));

    const tab =
      document.querySelector(
        '.tab[data-view="' + view + '"]'
      );

    const target =
      document.getElementById(view);

    if(tab) tab.classList.add("active");
    if(target) target.classList.add("active");

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });
  }


  learningTab.addEventListener("click",function(){
    openView("learning");
  });


  shortcut.addEventListener("click",function(){
    openView("learning");
  });


  /* =========================================================
     5. PROGRESO
  ========================================================= */

  const STORAGE_KEY =
    "msmpLearningProgressV1";

  const LESSONS = [
    "start",
    "dashboard",
    "clientes",
    "contenido",
    "tareas",
    "campanas",
    "aprobaciones",
    "assistant"
  ];


  function getProgress(){

    try{

      const saved =
        JSON.parse(
          localStorage.getItem(STORAGE_KEY) || "[]"
        );

      return new Set(
        Array.isArray(saved)
          ? saved.filter(id => LESSONS.includes(id))
          : []
      );

    }catch(error){

      return new Set();

    }

  }


  function saveProgress(progress){

    try{

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify([...progress])
      );

    }catch(error){}

  }


  function updateProgress(){

    const progress = getProgress();

    const count = progress.size;

    const progressText =
      document.getElementById(
        "learningProgressText"
      );

    const progressFill =
      document.getElementById(
        "learningProgressFill"
      );

    const completeBanner =
      document.getElementById(
        "learningCompleteBanner"
      );


    if(progressText){

      progressText.textContent =
        count + " / " + LESSONS.length;

    }


    if(progressFill){

      progressFill.style.width =
        ((count / LESSONS.length) * 100) + "%";

    }


    if(completeBanner){

      completeBanner.classList.toggle(
        "show",
        count === LESSONS.length
      );

    }


    document
      .querySelectorAll("[data-complete]")
      .forEach(checkbox => {

        checkbox.checked =
          progress.has(
            checkbox.dataset.complete
          );

        const card =
          checkbox.closest(".lesson-card");

        if(card){

          card.classList.toggle(
            "is-complete",
            checkbox.checked
          );

        }

      });

  }


  /* =========================================================
     6. ABRIR / CERRAR LECCIONES
  ========================================================= */

  function openLesson(id){

    const card =
      document.querySelector(
        '.lesson-card[data-lesson="' + id + '"]'
      );

    if(!card) return;


    document
      .querySelectorAll(".lesson-card.open")
      .forEach(other => {

        if(other !== card){

          other.classList.remove("open");

          const button =
            other.querySelector(
              ".lesson-toggle"
            );

          if(button){
            button.textContent = "Abrir";
          }

        }

      });


    card.classList.add("open");

    const button =
      card.querySelector(".lesson-toggle");

    if(button){
      button.textContent = "Cerrar";
    }


    card.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  }


  document
    .querySelectorAll(".lesson-toggle")
    .forEach(button => {

      button.addEventListener(
        "click",
        function(){

          const card =
            button.closest(".lesson-card");

          const open =
            card.classList.toggle("open");

          button.textContent =
            open ? "Cerrar" : "Abrir";

        }
      );

    });


  /* =========================================================
     7. COMPLETAR LECCIONES
  ========================================================= */

  document
    .querySelectorAll("[data-complete]")
    .forEach(checkbox => {

      checkbox.addEventListener(
        "change",
        function(){

          const progress =
            getProgress();

          const id =
            checkbox.dataset.complete;


          if(checkbox.checked){

            progress.add(id);

          }else{

            progress.delete(id);

          }


          saveProgress(progress);
          updateProgress();

        }
      );

    });


  /* =========================================================
     8. BOTONES IR A...
  ========================================================= */

  document
    .querySelectorAll("[data-go-view]")
    .forEach(button => {

      button.addEventListener(
        "click",
        function(){

          openView(
            button.dataset.goView
          );

        }
      );

    });


  /* =========================================================
     9. CONTROLES PRINCIPALES
  ========================================================= */

  const startButton =
    document.getElementById(
      "learningStartBtn"
    );

  const continueButton =
    document.getElementById(
      "learningContinueBtn"
    );

  const resetButton =
    document.getElementById(
      "learningResetBtn"
    );

  const openAllButton =
    document.getElementById(
      "learningOpenAllBtn"
    );


  startButton.addEventListener(
    "click",
    function(){

      openLesson("start");

    }
  );


  continueButton.addEventListener(
    "click",
    function(){

      const progress =
        getProgress();

      const next =
        LESSONS.find(
          id => !progress.has(id)
        ) || "start";

      openLesson(next);

    }
  );


  resetButton.addEventListener(
    "click",
    function(){

      const sure =
        confirm(
          "¿Reiniciar el progreso del Learning Center en este dispositivo?"
        );

      if(!sure) return;


      try{

        localStorage.removeItem(
          STORAGE_KEY
        );

      }catch(error){}


      updateProgress();
      openLesson("start");

    }
  );


  openAllButton.addEventListener(
    "click",
    function(){

      const cards =
        [...document.querySelectorAll(
          ".lesson-card"
        )];

      const shouldOpen =
        cards.some(
          card =>
            !card.classList.contains("open")
        );


      cards.forEach(card => {

        card.classList.toggle(
          "open",
          shouldOpen
        );

        const button =
          card.querySelector(
            ".lesson-toggle"
          );

        if(button){

          button.textContent =
            shouldOpen
              ? "Cerrar"
              : "Abrir";

        }

      });


      openAllButton.textContent =
        shouldOpen
          ? "Cerrar módulos"
          : "Abrir módulos";

    }
  );


  updateProgress();

})();
</script>
